# ============================================
# Spring Boot 应用配置（默认：H2 内存数据库）
#
# 切换 MySQL：设置环境变量 DB_MODE=mysql
# 或在 dev.sh 中将 DB_MODE 改为 mysql
# ============================================

server:
  port: 8080

spring:
  application:
    name: demo

  # H2 数据源（默认，开箱即用）
  datasource:
    url: jdbc:h2:mem:scaffold_db;DB_CLOSE_DELAY=-1;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # H2 控制台（开发调试用，访问 http://localhost:8080/h2-console）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 启动时执行建表脚本
  sql:
    init:
      mode: always
      schema-locations: classpath:schema-h2.sql
      continue-on-error: true

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
